<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | PrepMate AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; overflow-y: auto; overflow-x: hidden; }
        h1, .logo { font-family: 'Space Grotesk', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .gradient-text { background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.3; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-4">
    
    <canvas id="bg-canvas"></canvas>

    <div class="w-full max-w-md z-10">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-black tracking-tighter mb-2">PrepMate<span class="gradient-text"> AI</span></h1>
            <p class="text-slate-500 font-medium tracking-tight">Your intelligent career companion</p>
        </div>

        <div class="glass p-10 rounded-[2.5rem] shadow-2xl">
            <h2 class="text-2xl font-bold mb-8 tracking-tight">Sign In</h2>
            
            {% if message %}
            <div class="bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-2xl mb-6 text-xs font-bold flex items-center gap-3">
                <span>⚠️</span> {{ message }}
            </div>
            {% endif %}

            <form action="/login" method="POST" class="space-y-6">
                <div class="space-y-2">
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 ml-1">Username</label>
                    <input type="text" name="username" required placeholder="Enter username"
                        class="w-full bg-slate-900/40 border border-white/5 rounded-2xl px-5 py-4 text-white placeholder:text-slate-700 focus:outline-none focus:ring-1 focus:ring-indigo-500/50 transition-all">
                </div>
                <div class="space-y-2">
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 ml-1">Password</label>
                    <input type="password" name="password" required placeholder="••••••••"
                        class="w-full bg-slate-900/40 border border-white/5 rounded-2xl px-5 py-4 text-white placeholder:text-slate-700 focus:outline-none focus:ring-1 focus:ring-indigo-500/50 transition-all">
                </div>
                
                <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 rounded-2xl shadow-xl shadow-indigo-500/20 transition-all transform hover:-translate-y-1 active:scale-95 uppercase tracking-widest text-xs">
                    Access Dashboard
                </button>
            </form>

            <div class="mt-10 pt-8 border-t border-white/5 text-center">
                <p class="text-slate-500 text-sm">
                    Don't have an account? 
                    <a href="/" class="text-indigo-400 hover:text-indigo-300 font-bold transition-colors">Join Now</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let points = [];
        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            points = [];
            for (let i = 0; i < 40; i++) points.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3 });
        }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(99, 102, 241, 0.1)';
            for (let i = 0; i < points.length; i++) {
                let p = points[i]; p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1; if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                for (let j = i + 1; j < points.length; j++) {
                    let p2 = points[j]; let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 300) { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); }
                }
            }
            requestAnimationFrame(draw);
        }
        window.onresize = init; init(); draw();
    </script>
</body>
</html>
