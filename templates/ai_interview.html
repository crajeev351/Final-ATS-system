<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mock Interview | ATS.AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .gradient-text { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        @keyframes pulse-custom {
            0% { transform: scale(1); opacity: 0.6; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { transform: scale(1); opacity: 0.6; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .speaking-active { animation: pulse-custom 1.5s infinite; }
    </style>
</head>
<body class="bg-[#020617] text-slate-200 min-h-screen">

    <nav class="sticky top-0 z-50 glass border-b border-white/5 px-6 py-4 mb-10">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="/dashboard" class="text-2xl font-black tracking-tighter">ATS<span class="gradient-text">.AI</span></a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 relative">
        
        <!-- Start Overlay -->
        <div id="start-overlay" class="absolute inset-0 z-[60] glass rounded-[3rem] flex flex-col items-center justify-center text-center p-12 border border-white/10">
            <div class="w-24 h-24 bg-indigo-500/10 rounded-full flex items-center justify-center text-5xl mb-8 animate-bounce">🎙️</div>
            <h2 class="text-3xl font-black mb-4">AI Interview <span class="gradient-text">Ready</span></h2>
            <p class="text-slate-400 max-w-sm mb-10 leading-relaxed text-lg">Position yourself in a quiet, well-lit environment. AI will monitor biometrics for a fair assessment.</p>
            <button onclick="beginInterview()" class="px-12 py-5 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-2xl shadow-2xl shadow-indigo-500/40 transition-all transform hover:-translate-y-1 active:scale-95 text-lg">
                🚀 Start Session
            </button>
        </div>

        <div class="glass p-8 md:p-12 rounded-[3rem] shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1.5 bg-slate-900">
                <div id="progress-bar" class="h-full bg-gradient-to-r from-indigo-500 to-purple-500 transition-all duration-500" style="width: 0%"></div>
            </div>

            <div id="question" class="text-xl md:text-2xl font-bold text-center mb-12 min-h-[4rem] leading-relaxed text-slate-100">
                Initialising AI interviewer environment...
            </div>

            <div class="relative flex justify-center mb-10">
                <div class="relative rounded-3xl overflow-hidden border-4 border-white/5 shadow-2xl bg-black aspect-video w-full max-w-[540px]">
                    <video id="video" autoplay muted class="w-full h-full object-cover grayscale-[0.2] contrast-[1.1]"></video>
                    <div id="face-status" class="absolute top-4 left-1/2 -translate-x-1/2 px-4 py-1.5 glass rounded-full text-[10px] font-black uppercase tracking-widest border border-white/10">
                        Checking Hardware...
                    </div>
                    <div id="speaking-indicator" class="absolute bottom-6 right-6 w-5 h-5 bg-green-500 rounded-full hidden"></div>
                </div>
            </div>

            <div class="space-y-6">
                <textarea id="answer" placeholder="Your professional response will appear here as you speak..." 
                    class="w-full bg-slate-900/60 border border-slate-800 rounded-3xl px-6 py-5 text-white placeholder:text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition-all min-h-[140px] resize-none"></textarea>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <button onclick="repeatQuestion()" class="py-4 bg-white/5 hover:bg-white/10 text-slate-400 font-bold rounded-2xl border border-white/5 transition-all flex items-center justify-center gap-2">
                        🔊 Repeat Question
                    </button>
                    <button onclick="toggleListening()" id="mic-btn" class="py-4 bg-indigo-600/10 hover:bg-indigo-600/20 text-indigo-400 font-black rounded-2xl border border-indigo-500/20 transition-all flex items-center justify-center gap-2">
                        🎙 Speak Response
                    </button>
                    <button onclick="submitAnswer()" id="submit-btn" class="py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-2xl shadow-xl shadow-indigo-500/20 transition-all flex items-center justify-center gap-2 transform hover:-translate-y-1">
                        Next Phase →
                    </button>
                </div>
            </div>

            <div id="score-container" class="hidden text-center mt-12 pt-12 border-t border-white/5 animate-in fade-in zoom-in duration-500">
                <button onclick="viewScoreCard()" id="view-score-btn" class="w-full py-5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-black rounded-2xl shadow-2xl transition-all transform hover:-translate-y-1 text-lg">
                    📊 Generate Performance Report
                </button>
                <p id="saving-msg" class="mt-4 text-slate-500 text-xs font-bold uppercase tracking-widest animate-pulse">AI is calculating your confidence and technical scores...</p>
            </div>
        </div>
    </main>

    <!-- Scripts (MediaPipe, TFJS, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <script>
        // Core Logic (Remains identical but UI elements are updated)
        let questions = [];
        let currentQuestionIndex = 0;
        let voices = [];
        let allAnswers = [];
        let faceScore = { stability: 0, frames: 0, mouthOpening: 0, smileScore: 0, blinkCount: 0 };
        let cheatingFlags = { noFace: 0, phoneDetected: 0, extraPersons: 0 };
        let objectDetector;

        cocoSsd.load().then(model => { objectDetector = model; });

        fetch("/get-all-questions").then(res => res.json()).then(data => {
            questions = data.questions;
            if (questions.length > 0) document.getElementById("question").innerText = "Everything looks good. Click 'Start Session' when ready.";
        });

        function beginInterview() {
            document.getElementById("start-overlay").classList.add('hidden');
            if (questions.length > 0) {
                document.getElementById("question").innerText = questions[0];
                speak(questions[0]);
            }
        }

        const videoElement = document.getElementById("video");
        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => { videoElement.srcObject = stream; });

        const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });

        faceMesh.onResults(results => {
            const statusEl = document.getElementById("face-status");
            if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
                statusEl.innerText = "No Face Detected"; statusEl.classList.add('text-red-500'); cheatingFlags.noFace++;
            } else {
                statusEl.innerText = "Assessment Active"; statusEl.classList.remove('text-red-500'); statusEl.classList.add('text-green-400');
                faceScore.frames++;
            }
        });
        new Camera(videoElement, { onFrame: async () => { await faceMesh.send({ image: videoElement }); }, width: 640, height: 480 }).start();

        function speak(text) {
            window.speechSynthesis.cancel();
            let speech = new SpeechSynthesisUtterance(text);
            const indicator = document.getElementById("speaking-indicator");
            speech.onstart = () => { indicator.classList.remove('hidden'); indicator.classList.add('speaking-active'); };
            speech.onend = () => { indicator.classList.add('hidden'); indicator.classList.remove('speaking-active'); };
            window.speechSynthesis.speak(speech);
        }

        function toggleListening() {
            const micBtn = document.getElementById("mic-btn");
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.onstart = () => { micBtn.innerText = "🛑 STOP"; micBtn.classList.replace('text-indigo-400', 'text-red-500'); };
            recognition.onresult = (e) => { document.getElementById("answer").value += e.results[0][0].transcript; };
            recognition.onend = () => { micBtn.innerText = "🎙 SPEAK"; micBtn.classList.replace('text-red-500', 'text-indigo-400'); };
            recognition.start();
        }

        function submitAnswer() {
            const ans = document.getElementById("answer").value;
            if (!ans) return alert("Please speak or type your answer.");
            allAnswers.push(ans);
            currentQuestionIndex++;
            document.getElementById("progress-bar").style.width = (currentQuestionIndex / questions.length) * 100 + "%";
            if (currentQuestionIndex < questions.length) {
                document.getElementById("question").innerText = questions[currentQuestionIndex];
                speak(questions[currentQuestionIndex]);
                document.getElementById("answer").value = "";
            } else { finishInterview(); }
        }

        function finishInterview() {
            document.getElementById("submit-btn").classList.add('hidden');
            document.getElementById("score-container").classList.remove('hidden');
            fetch("/final-evaluation", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ answers: allAnswers, face: faceScore, cheating: cheatingFlags }) })
            .then(res => res.json()).then(data => {
                return fetch("/show-final-report", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
            }).then(() => {
                document.getElementById("saving-msg").innerText = "Analysis Complete!";
            });
        }
        function viewScoreCard() { window.location.href = "/final-report"; }
        function repeatQuestion() { speak(questions[currentQuestionIndex]); }
    </script>
</body>
</html>
